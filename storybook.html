<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Peacock-Storybook</title>
<style>
:root {
    /* 基準サイズ (アスペクト比計算用) */
    --base-width: 840;
    --base-height: 594;
    --aspect-ratio: calc(var(--base-width) / var(--base-height));
    
    --page-bg: #fdfbf7;
    --page-thickness: 5px;
    --transition-speed: 1.2s; 
}

* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    /* モバイルのアドレスバー対策: svhを使用 */
    min-height: 100svh;
    width: 100vw;
    font-family: system-ui, sans-serif;
    background-image: url("./pict/background.png");
    background-size: cover;
    background-position: center;
    overflow: hidden;
    /* タップ遅延などを防ぐ */
    touch-action: manipulation;
}

.flipbook-container {
    position: relative;
    perspective: 3000px;
    transform-style: preserve-3d;
    transition: transform 0.6s ease-out; /* コンテナ自体の移動アニメーション */
}

/* --- PC / タブレット (見開きモード) のサイズ計算 --- */
@media (min-width: 601px) {
    .flipbook-container {
        /* 画面幅の96%以内、高さ92svh以内、かつ最大ピクセルを超えないようにアスペクト比維持 */
        height: min(709px, 92svh, 96vw / var(--aspect-ratio));
        width: calc(min(709px, 92svh, 96vw / var(--aspect-ratio)) * var(--aspect-ratio));
    }

    .page {
        width: 50%;
    }
}

/* --- スマホ (単ページモード) のサイズ計算 --- */
@media (max-width: 600px) {
    .flipbook-container {
        /* 【重要】スマホでも構造上は「見開き(2ページ分)」として計算します。
           ページ幅を50%のまま維持するため、コンテナ幅は「1ページ幅 × 2」にします。
        */
        
        /* 1ページのアスペクト比 = (全幅 / 2) / 高さ */
        --single-page-aspect: calc((var(--base-width) / 2) / var(--base-height));
        
        /* 画面の幅(94vw)または高さ(85svh)に合わせて1ページのサイズを決める */
        /* 高さ基準の場合の1ページ幅 */
        --h-based-width: calc(85svh * var(--single-page-aspect));
        
        /* 幅基準の場合の1ページ幅 (最大94vw) */
        --w-based-width: 94vw;
        
        /* 小さい方を採用して画面に収める */
        --one-page-width: min(var(--w-based-width), var(--h-based-width));
        --one-page-height: calc(var(--one-page-width) / var(--single-page-aspect));

        /* コンテナ幅は2ページ分確保する */
        width: calc(var(--one-page-width) * 2);
        height: var(--one-page-height);
    }

    .page {
        width: 100%;
    }
}

.book {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform var(--transition-speed) cubic-bezier(0.645, 0.045, 0.355, 1);
}

.page {
    position: absolute;
    top: 0;
    /* ページ配置の原点は中央(背表紙) */
    left: 50%;
    height: 100%;
    transform-origin: left center;
    transition: transform var(--transition-speed) cubic-bezier(0.645, 0.045, 0.355, 1);
    transform-style: preserve-3d;
    cursor: pointer;
}

.page-wrapper {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
}

.page-content {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: var(--page-bg);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

.page-front {
    transform: translateZ(calc(var(--page-thickness)/2));
}

.page-back {
    transform: rotateY(180deg) translateZ(calc(var(--page-thickness)/2));
}

.page.flipped {
    transform: rotateY(-180deg);
}

/* Z-index管理: めくっていないページは番号順、めくったページは逆順 */
.page:not(.flipped) {
    z-index: calc(100 - var(--leaf-index));
}
.page.flipped {
    z-index: calc(var(--leaf-index));
}

.full-page-media {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f3f4f6;
}

/* 動きを減らす設定への対応 */
@media (prefers-reduced-motion: reduce) {
    .book, .page, .flipbook-container {
        transition: transform 0s !important;
        --transition-speed: 0s;
    }
}
</style>

        // 状態管理
        let currentLeaf = 0;
        const totalLeaves = 9;
        
        // モバイル判定のしきい値
        const MOBILE_BREAKPOINT = 600;

        // 音声再生関数
        function playFlipSound() {
            if (flipSound) {
                flipSound.currentTime = 0;
                flipSound.volume = 0.5;
                flipSound.play().catch(() => {});
            }
        }

        // ページ遷移のメイン関数
        // isNext: trueなら次へ、falseなら前へ
        function advance(isNext) {
            const isMobile = window.innerWidth <= MOBILE_BREAKPOINT;

            if (isMobile) {
                // スマホ：ステップ単位で進む (0=Leaf0右, 1=Leaf1左, 2=Leaf1右, 3=Leaf2左...)
                let currentStep = getMobileStepFromLeaf(currentLeaf);
                
                let nextStep;
                if (isNext) {
                    nextStep = currentStep + 1;
                } else {
                    nextStep = currentStep - 1;
                }
                
                // 範囲チェック (Leaf 0の右 ～ Leaf 9の左/右まで)
                // ステップの最大値は totalLeaves*2 - 1 (最後のページの裏側まで)
                // ただし今回は最終ページが背表紙(99)で終わるので、totalLeavesまで行けるように調整
                if (nextStep < 0) return;
                if (nextStep > totalLeaves * 2) return; // 制限

                const newLeafState = getLeafFromMobileStep(nextStep);
                
                // ページめくりが必要か確認
                if (newLeafState.leaf !== currentLeaf) {
                    // めくり動作が必要な場合だけ音を鳴らす
                    if(newLeafState.leaf >= 0 && newLeafState.leaf <= totalLeaves) {
                        playFlipSound();
                        updateFlipState(newLeafState.leaf);
                        currentLeaf = newLeafState.leaf;
                    }
                }
                // カメラ位置(Transform)の更新 (めくり不要でもカメラ移動はある)
                updateTransform();

            } else {
                // PC：Leaf単位で進む
                let nextLeaf = isNext ? currentLeaf + 1 : currentLeaf - 1;
                
                if (nextLeaf < 0 || nextLeaf > totalLeaves) return;
                
                playFlipSound();
                currentLeaf = nextLeaf;
                updateFlipState(currentLeaf);
                updateTransform();
            }
        }

        // 指定したLeaf番号までめくる/戻す (DOM操作のみ)
        function updateFlipState(n) {
            document.querySelectorAll('.page').forEach((p, i) => {
                // n番目以下のページは「めくられた状態(flipped)」にする
                p.classList.toggle('flipped', (i + 1) <= n);
            });
        }

        // 表示（Transform）の更新
        function updateTransform() {
            const b = document.getElementById('book');
            const c = document.getElementById('container');
            const isMobile = window.innerWidth <= MOBILE_BREAKPOINT;

            if (isMobile) {
                // --- スマホ用ビュー (カメラ移動ロジック) ---
                const step = getMobileStepFromLeaf(currentLeaf);
                const isViewingRight = (step % 2 === 0);
                
                // コンテナを左右にずらして、左ページor右ページを画面中央に持ってくる
                const translateX = isViewingRight ? '-50%' : '50%';
                
                if (currentLeaf === 0) {
                    // 表紙
                    b.style.transform = 'translateX(-50%) rotateY(20deg) rotateX(5deg)';
                } else if (currentLeaf === totalLeaves) {
                    // 裏表紙
                    b.style.transform = 'translateX(50%) rotateY(-20deg) rotateX(5deg)';
                } else {
                    // 中ページ（フラット）
                    b.style.transform = `translateX(${translateX}) rotateY(0deg) rotateX(0deg)`;
                }
                
            } else {
                // --- PC用ビュー (3D傾きあり) ---
                if (currentLeaf === 0) {
                    // 表紙
                    b.style.transform = 'translateX(-25%) rotateY(20deg) rotateX(5deg)';
                } else if (currentLeaf === totalLeaves) {
                    // 裏表紙
                    b.style.transform = 'translateX(25%) rotateY(-20deg) rotateX(5deg)';
                } else {
                    // 中ページ（フラット）
                    b.style.transform = 'translateX(0) rotateY(0) rotateX(0)';
                }
            }
        }

        // --- ヘルパー関数: Leaf番号とスマホ表示ステップの変換 ---
        // Step 0: Leaf 0 (未めくり), 右側(Page0)を見る
        // Step 1: Leaf 1 (めくり済), 左側(Page1)を見る
        // Step 2: Leaf 1 (めくり済), 右側(Page2)を見る
        // Step 3: Leaf 2 (めくり済), 左側(Page3)を見る
        
        // スマホ用に追加の状態変数
        // 'left' (前のページの裏 = 左側) または 'right' (次のページの表 = 右側)
        // 初期状態はLeaf0で右側(Page0)を見ている
        let mobileViewSide = 'right'; 

        // オーバーライド: スマホ用ステップ管理
        function getMobileStepFromLeaf(leaf) {
            // 現在のLeaf数と、左右どちらを見ているかでステップ数を算出
            // Leaf 0, Right = Step 0
            // Leaf 1, Left  = Step 1
            // Leaf 1, Right = Step 2
            // Leaf 2, Left  = Step 3
            if (leaf === 0) return 0;
            const base = (leaf * 2) - 1; // Leaf 1 -> 1
            return mobileViewSide === 'left' ? base : base + 1;
        }

        function getLeafFromMobileStep(step) {
            // ステップ数から、あるべきLeaf数と左右状態を逆算
            // Step 0 -> Leaf 0, Right
            // Step 1 -> Leaf 1, Left
            // Step 2 -> Leaf 1, Right
            // Step 3 -> Leaf 2, Left
            
            if (step === 0) return { leaf: 0, side: 'right' };
            
            const isLeft = (step % 2 !== 0);
            const leaf = isLeft ? (step + 1) / 2 : step / 2;
            
            // 副作用としてsideを更新
            mobileViewSide = isLeft ? 'left' : 'right';
            
            return { leaf: leaf, side: isLeft ? 'left' : 'right' };
        }

        // --- イベントリスナー ---

        // クリック操作
        // スマホでは「画面の右半分」タップで次、「左半分」タップで戻る
        // PCでは「クリックされたページ」に応じて判定
        document.body.onclick = (e) => {
            const isMobile = window.innerWidth <= MOBILE_BREAKPOINT;
            
            if (isMobile) {
                // 画面幅の半分より右なら「次へ」、左なら「前へ」
                const isRightSide = e.clientX > window.innerWidth / 2;
                advance(isRightSide);
            } else {
                // PC: クリックされた要素が .page の場合、そのページが flipped かどうかで判断
                const targetPage = e.target.closest('.page');
                if (targetPage) {
                    if (targetPage.classList.contains('flipped')) {
                        // めくられたページをクリック -> 戻る
                        advance(false);
                    } else {
                        // まだめくってないページをクリック -> 進む
                        advance(true);
                    }
                    return;
                }

                // 表紙だけは「本の見えている範囲」ならどこを押しても次へ
                if (currentLeaf === 0) {
                  const container = document.getElementById('container');
                  const rect = container.getBoundingClientRect();
                  const inside =
                    e.clientX >= rect.left && e.clientX <= rect.right &&
                    e.clientY >= rect.top  && e.clientY <= rect.bottom;

                  if (inside) advance(true);
                }

                // 裏表紙だけは「本の見えている範囲」ならどこを押しても戻る
                if (currentLeaf === totalLeaves) {
                  const container = document.getElementById('container');
                  const rect = container.getBoundingClientRect();
                  const inside =
                    e.clientX >= rect.left && e.clientX <= rect.right &&
                    e.clientY >= rect.top  && e.clientY <= rect.bottom;

                  if (inside) advance(false);
                }
            }
        };

        // キーボード操作
        document.onkeydown = e => {
            if (e.key === 'ArrowRight') advance(true);
            if (e.key === 'ArrowLeft') advance(false);
        };

        // リサイズ時の調整
        window.onresize = () => {
            // モバイル⇔PC切り替え時に変な位置にならないよう再計算
            updateTransform();
        };

        // 初期化
        updateTransform();
    </script>
</body>
</html>
